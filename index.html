<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu ESF</title>
</head>
<body>
<script>
(async()=>{
  try{
    const r=await fetch('./Meu_ESF_Automatizado_corrigido_v2-3.html',{cache:'no-store'});
    if(!r.ok) throw new Error('Não foi possível carregar o aplicativo.');
    let h=await r.text();
    const old=/async function saveOrUpdatePatientFromForm\(u\)\{.*?\}\nasync function logHistory/s;
    const replacement=`async function saveOrUpdatePatientFromForm(u){const name=document.getElementById('f_name').value.trim(),ipm=document.getElementById('f_ipm').value.trim();if(!name||!ipm)throw new Error('Nome e IPM são obrigatórios.');const payload={name,ipm,birth_date:document.getElementById('f_birth').value||null,acs_name:document.getElementById('f_acs').value.trim()||null};let p=cache.patients.find(x=>x.ipm===ipm&&x.user_id===u);if(!p){const r=await db.from('patients').select('*').eq('user_id',u).eq('ipm',ipm).maybeSingle();if(r.error)throw r.error;p=r.data||null}if(p){p=await safe(db.from('patients').update(payload).eq('id',p.id).eq('user_id',u).select().single(),'atualizar paciente')}else{p=await safe(db.from('patients').insert({...payload,user_id:u}).select().single(),'cadastrar paciente')}return p}\nasync function logHistory`;
    if(old.test(h)) h=h.replace(old,replacement);
    document.open();document.write(h);document.close();
  }catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:24px">Não foi possível carregar o Meu ESF. '+(e.message||'Tente novamente.')+'</p>';console.error(e)}
})();
</script>
</body>
</html>
